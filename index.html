<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>麻雀チップカウンター</title>
  <style>
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    body{margin:0;background:#f3f4f6;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif}
    .app{max-width:560px;margin:auto;min-height:100vh;padding:14px 12px 28px}
    h1{font-size:22px;margin:0 0 12px}
    .card{background:#fff;border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 1px 4px #0001}
    .names{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
    input,select{width:100%;font-size:16px;padding:11px;border:1px solid #d1d5db;border-radius:11px;background:#fff}
    .players{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
    .player{border:1px solid #e5e7eb;border-radius:15px;padding:10px;text-align:center}
    .name{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .count{font-size:32px;font-weight:800;margin:5px 0}
    button{border:0;border-radius:11px;padding:11px 7px;font-size:15px;font-weight:700;background:#e5e7eb}
    button:active{transform:scale(.97)}
    .primary{background:#111827;color:#fff}
    .plus{background:#dbeafe}
    .danger{background:#fff;border:1px solid #d1d5db}
    .hidden{display:none}
    .movegrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
    .move{border:1px solid #e5e7eb;border-radius:14px;padding:11px}
    .move h3{font-size:15px;margin:0 0 8px}
    .move .row{display:grid;grid-template-columns:1fr 1fr;gap:7px}
    .move .custom-row{display:flex;gap:6px;margin-top:7px}
    .move .custom-row input{padding:8px;font-size:14px;text-align:center}
    .move .custom-row button{padding:8px 12px;white-space:nowrap}
    .wide{grid-column:1/-1}
    .muted{color:#6b7280;font-size:13px}
    .small{font-size:13px}
    .history-item{border-top:1px solid #eee;padding:10px 0}
    .history-item:first-child{border-top:0}
    .rowline{display:flex;justify-content:space-between;gap:8px}
  </style>
</head>
<body>
  <div class="app">
    <h1>🀄 麻雀チップカウンター</h1>
    
    <div id="setup" class="card">
      <b>3人の名前</b>
      <div style="height:9px"></div>
      <div class="names">
        <input id="n0" placeholder="1人目">
        <input id="n1" placeholder="2人目">
        <input id="n2" placeholder="3人目">
      </div>
      <div style="height:10px"></div>
      <button class="primary" style="width:100%" onclick="startGame()">対局を開始</button>
    </div>

    <div id="game" class="hidden">
      <div class="card">
        <div class="players" id="players"></div>
      </div>

      <div class="card">
        <b>チップを移動</b>
        <div style="height:9px"></div>
        <div class="movegrid">
          <!-- ツモ -->
          <div class="move">
            <h3>🀄 ツモ（2人から）</h3>
            <select id="tsumo"></select>
            <div style="height:7px"></div>
            <div class="row">
              <button class="plus" onclick="tsumo(1)">＋1</button>
              <button class="plus" onclick="tsumo(2)">＋2</button>
              <button class="plus" onclick="tsumo(3)">＋3</button>
              <button class="plus" onclick="tsumo(10)">＋10</button>
            </div>
            <div class="custom-row">
              <input type="number" id="tsumoCustom" placeholder="枚数" min="1" step="1">
              <button class="plus" onclick="tsumoCustom()">移動</button>
            </div>
          </div>

          <!-- ロン -->
          <div class="move">
            <h3>🀄 ロン（放銃者から）</h3>
            <select id="ronwin"></select>
            <div style="height:7px"></div>
            <select id="ronlose"></select>
            <div style="height:7px"></div>
            <div class="row">
              <button class="plus" onclick="ron(1)">＋1</button>
              <button class="plus" onclick="ron(2)">＋2</button>
              <button class="plus" onclick="ron(3)">＋3</button>
              <button class="plus" onclick="ron(10)">＋10</button>
            </div>
            <div class="custom-row">
              <input type="number" id="ronCustom" placeholder="枚数" min="1" step="1">
              <button class="plus" onclick="ronCustom()">移動</button>
            </div>
          </div>
        </div>
        <div class="muted" style="margin-top:9px">ツモ：受け取る人が2人から同じ枚数受け取る ／ ロン：放銃者から受け取る</div>
      </div>

      <div class="card">
        <div class="movegrid">
          <button class="danger" onclick="undo()">↩ 1手戻す</button>
          <button class="primary" onclick="finishGame()">対局終了・履歴保存</button>
        </div>
      </div>
    </div>

    <div class="card">
      <b>対局履歴</b>
      <div style="height:8px"></div>
      <div id="history"></div>
      <button id="clear" class="danger small hidden" style="width:100%;margin-top:8px" onclick="clearHistory()">履歴を全削除</button>
    </div>
  </div>

  <script>
    const KEY="mahjong_chip_counter_v2", HK=KEY+"_history";
    let state={names:["","",""],counts:[0,0,0],moves:[]};
    let histories=JSON.parse(localStorage.getItem(HK)||"[]");

    function save(){localStorage.setItem(KEY,JSON.stringify(state))}
    function esc(s){return s.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}

    function startGame(){
      state.names=[0,1,2].map(i=>document.getElementById("n"+i).value.trim()||`${i+1}人目`);
      state.counts=[0,0,0];
      state.moves=[];
      save();
      document.getElementById("setup").classList.add("hidden");
      document.getElementById("game").classList.remove("hidden");
      render();
    }

    function render(){
      document.getElementById("players").innerHTML=state.names.map((n,i)=>`<div class="player"><div class="name">${esc(n)}</div><div class="count">${state.counts[i]>=0?"+":""}${state.counts[i]}</div></div>`).join("");
      ["tsumo","ronwin","ronlose"].forEach(id=>{
        let s=document.getElementById(id),old=s.value,first=id==="ronlose"?"放銃者を選択":id==="ronwin"?"受け取る人を選択":"受け取る人を選択";
        s.innerHTML=`<option value="-1">${first}</option>`+state.names.map((n,i)=>`<option value="${i}">${esc(n)}</option>`).join("");
        if(old)s.value=old;
      });
      renderHistory();
    }

    function apply(changes,label){
      state.moves.push({changes,label});
      changes.forEach(([i,d])=>state.counts[i]=Math.max(-999,Math.min(999,state.counts[i]+d)));
      save();
      render();
    }

    function tsumo(v){
      let w=+document.getElementById("tsumo").value;
      if(w<0)return alert("受け取る人を選択してください");
      let o=[0,1,2].filter(i=>i!==w);
      apply([[w, v * 2],[o[0], -v],[o[1], -v]], `ツモ ${state.names[w]} +${v * 2} / ${state.names[o[0]]}, ${state.names[o[1]]} 各-${v}`);
    }

    function tsumoCustom(){
      let input=document.getElementById("tsumoCustom");
      let v=parseInt(input.value,10);
      if(isNaN(v)||v<=0)return alert("1以上の枚数を入力してください");
      tsumo(v);
      input.value="";
    }

    function ron(v){
      let w=+document.getElementById("ronwin").value,l=+document.getElementById("ronlose").value;
      if(w<0||l<0)return alert("受け取る人と放銃者を選択してください");
      if(w===l)return alert("受け取る人と放銃者は別にしてください");
      apply([[w,v],[l,-v]],`ロン ${state.names[w]} +${v} / ${state.names[l]} -${v}`);
    }

    function ronCustom(){
      let input=document.getElementById("ronCustom");
      let v=parseInt(input.value,10);
      if(isNaN(v)||v<=0)return alert("1以上の枚数を入力してください");
      ron(v);
      input.value="";
    }

    function undo(){
      let m=state.moves.pop();
      if(!m)return;
      for(const [i,d] of m.changes)state.counts[i]-=d;
      save();
      render();
    }

    function finishGame(){
      if(!confirm("この対局を履歴に保存しますか？"))return;
      histories.unshift({date:new Date().toISOString(),names:[...state.names],counts:[...state.counts],moves:state.moves.map(x=>x.label)});
      histories=histories.slice(0,200);
      localStorage.setItem(HK,JSON.stringify(histories));
      state={names:[...state.names],counts:[0,0,0],moves:[]};
      save();
      document.getElementById("game").classList.add("hidden");
      document.getElementById("setup").classList.remove("hidden");
      renderHistory();
    }

    function renderHistory(){
      let el=document.getElementById("history");
      document.getElementById("clear").classList.toggle("hidden",!histories.length);
      if(!histories.length){el.innerHTML='<div class="muted">まだ履歴はありません</div>';return}
      el.innerHTML=histories.map((h,i)=>{
        let d=new Date(h.date);
        return `<div class="history-item"><div class="rowline"><b>${d.toLocaleDateString("ja-JP")} ${d.toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"})}</b><button class="small danger" onclick="del(${i})">削除</button></div><div class="small" style="margin-top:5px">${h.names.map((n,j)=>`${esc(n)} ${h.counts[j]>=0?"+":""}${h.counts[j]}`).join(" ")}</div><div class="muted">${h.moves.length}回の移動</div></div>`;
      }).join("");
    }

    function del(i){
      histories.splice(i,1);
      localStorage.setItem(HK,JSON.stringify(histories));
      renderHistory();
    }

    function clearHistory(){
      if(confirm("履歴をすべて削除しますか？")){
        histories=[];
        localStorage.setItem(HK,"[]");
        renderHistory();
      }
    }

    renderHistory();
  </script>
</body>
</html>
